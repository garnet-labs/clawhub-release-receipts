name: Plugin releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-releases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  install:
    name: Install ${{ matrix.plugin }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        plugin: [matrix, whatsapp, memory-lancedb, discord]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.22.3'

      - name: Prepare OpenClaw runtime
        run: bash scripts/install-release.sh prepare

      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
        with:
          job_index: ${{ strategy.job-index }}
          job_total: ${{ strategy.job-total }}

      - name: Install and list plugins
        env:
          CASE_ID: ${{ matrix.plugin }}
        run: bash scripts/install-release.sh install "cases/$CASE_ID.json"

      - name: First load
        env:
          CASE_ID: ${{ matrix.plugin }}
        run: bash scripts/install-release.sh first-load "cases/$CASE_ID.json"

      - name: Let sensor settle
        if: always()
        run: sleep 30

  static:
    name: Check archived scan summaries
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check scan summaries without installing plugins
        run: |
          for case in jep-guard louter; do
            bash scripts/install-release.sh check-scan "cases/$case.json"
          done
